[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drugability-toolkit"
version = "1.0.0"
description = "RDKit-based workflow for small-molecule developability assessment"
readme = "README.md"
requires-python = ">=3.8"

authors = [
  {name = "Oluwaseun O. Ajayi", email = "oluwaseun.ajayi@uga.edu"}
]

license = {text = "MIT"}

keywords = [
  "cheminformatics",
  "drug-likeness",
  "RDKit",
  "computational chemistry",
  "medicinal chemistry",
  "synthetic accessibility"
]

dependencies = [
  "rdkit>=2023.3.1",
  "pandas>=1.5.0",
  "numpy>=1.24.0",
  "matplotlib>=3.6.0",
  "seaborn>=0.12.0",
  "scikit-learn>=1.2.0",
  "scipy>=1.10.0"
]

[project.urls]
Homepage = "https://github.com/Oluwaseun-O-Ajayi/drugability-toolkit"
Repository = "https://github.com/Oluwaseun-O-Ajayi/drugability-toolkit"
