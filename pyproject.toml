[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drugability-toolkit"
version = "1.1.1"
description = "RDKit-based workflow for small-molecule developability assessment"
readme = "README.md"
requires-python = ">=3.9"

authors = [
  {name = "Oluwaseun O. Ajayi", email = "oluwaseun.ajayi@uga.edu"}
]

license = {text = "MIT"}

keywords = [
  "cheminformatics",
  "drug-likeness",
  "RDKit",
  "computational chemistry",
  "medicinal chemistry",
  "synthetic accessibility"
]

dependencies = [
  "rdkit>=2023.3.1",
  "pandas>=1.5.0",
  "numpy>=1.24.0",
  "matplotlib>=3.6.0",
  "seaborn>=0.12.0"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["drugability_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Issues = "https://github.com/Oluwaseun-O-Ajayi/drugability-toolkit/issues"
Homepage = "https://github.com/Oluwaseun-O-Ajayi/drugability-toolkit"
Repository = "https://github.com/Oluwaseun-O-Ajayi/drugability-toolkit"
